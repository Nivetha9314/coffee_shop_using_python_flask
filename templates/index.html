<!DOCTYPE html>
<html>

<head>

    <title>Coffee Shop</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f5eee8;
            margin: 0;
        }

        header {
            background-color: #4b2e2e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .form-box {
            background-color: white;
            padding: 20px;
            width: 400px;
            margin: auto;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            padding: 10px 20px;
            background-color: #4b2e2e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        h2 {
            text-align: center;
            color: #4b2e2e;
            margin-top: 30px;
        }

        .coffee-list {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .coffee {
            background-color: white;
            padding: 20px;
            width: 200px;
            text-align: center;
            border-radius: 8px;
        }

        .coffee h3 {
            color: #4b2e2e;
        }

        .coffee h4 {
            font-size: 18px;
        }

        .update {
            background-color: orange;
        }

        .delete {
            background-color: red;
        }

    </style>

</head>


<body>

    <header>

        <h1>☕ My Coffee Shop</h1>

        <p>Fresh Coffee Every Day</p>

    </header>


    <div class="container">


        <h2>Add Coffee</h2>


        <div class="form-box">

            <form action="/coffee" method="POST">

                <label>Coffee Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter coffee name"
                    required
                >


                <label>Price</label>

                <input
                    type="number"
                    name="price"
                    placeholder="Enter price"
                    required
                >


                <label>Description</label>

                <input
                    type="text"
                    name="description"
                    placeholder="Enter description"
                    required
                >


                <button type="submit">
                    Add Coffee
                </button>

            </form>

        </div>


        <h2>Coffee Menu</h2>


        <div class="coffee-list">


            {% for coffee in coffees %}


            <div class="coffee">

                <h3>
                    {{ coffee.name }}
                </h3>


                <p>
                    {{ coffee.description }}
                </p>


                <h4>
                    ₹{{ coffee.price }}
                </h4>


               <button
    class="update"
    data-id="{{ coffee.id }}"
    onclick="updateCoffee(this.dataset.id)">
    Update
</button>


                <button
    class="delete"
    data-id="{{ coffee.id }}"
    onclick="deleteCoffee(this.dataset.id)">
    Delete
</button>

            </div>


            {% endfor %}


        </div>


    </div>


    <script>

        function updateCoffee(id) {

            let name = prompt("Enter coffee name:");

            if (name == null) {
                return;
            }


            let price = prompt("Enter price:");

            if (price == null) {
                return;
            }


            let description = prompt("Enter description:");

            if (description == null) {
                return;
            }


            fetch("/coffee/" + id, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    price: price,

                    description: description

                })

            })

            .then(response => response.json())

            .then(data => {

                alert(data.message);

                location.reload();

            });

        }


        function deleteCoffee(id) {

            let confirmDelete = confirm(
                "Are you sure you want to delete this coffee?"
            );


            if (!confirmDelete) {
                return;
            }


            fetch("/coffee/" + id, {

                method: "DELETE"

            })

            .then(response => response.json())

            .then(data => {

                alert(data.message);

                location.reload();

            });

        }

    </script>


</body>

</html>
